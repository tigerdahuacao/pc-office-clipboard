name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build for Cloudflare Pages
        run: pnpm exec @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=clipboard --branch=main

      - name: Initialize D1 Database
        if: success()
        run: |
          pnpm dlx wrangler@latest d1 execute clipboard-db --remote --file=./scripts/d1-init.sql
        continue-on-error: true

      - name: Show deployment URL
        if: success()
        run: |
          echo "Deployment complete!"
          echo "Check status: pnpm dlx wrangler@latest pages deployment list --project-name=clipboard"